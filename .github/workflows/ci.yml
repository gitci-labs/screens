name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    runs-on: ubuntu-latest
    container: swift:6.2-jammy
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - run: cd js && pnpm install --frozen-lockfile
      - run: cd js && pnpm build
      - run: cd js && pnpm --filter @gitci/screens-renderer-node exec playwright install --with-deps chromium
      - run: swift build
      - run: .build/debug/gitci-screens doctor examples/minimal
      - run: .build/debug/gitci-screens doctor examples/minimal --json
      - run: .build/debug/gitci-screens validate examples/minimal
      - run: |
          tmpdir="$(mktemp -d)"
          package="screens-templates-v0.0.0"
          mkdir -p "$tmpdir/$package"
          rsync -a templates/gitci "$tmpdir/$package/"
          tar -czf "$tmpdir/$package.tar.gz" -C "$tmpdir" "$package"
          .build/debug/gitci-screens templates install \
            --repo gitci-labs/screens-templates \
            --version v0.0.0 \
            --archive "$tmpdir/$package.tar.gz" \
            --cache-root "$tmpdir/cache"
          .build/debug/gitci-screens templates list --cache-root "$tmpdir/cache"
          .build/debug/gitci-screens templates list --cache-root "$tmpdir/cache" --json
          test -d "$tmpdir/cache/screens-templates/v0.0.0/gitci/screens/packs"
      - run: .build/debug/gitci-screens build examples/minimal
      - run: .build/debug/gitci-screens gallery examples/minimal
      - run: .build/debug/gitci-screens archive examples/minimal
      - run: |
          python3 - <<'PY'
          import zipfile
          archive = 'examples/minimal/gitci/screens/build/launch.zip'
          with zipfile.ZipFile(archive) as zf:
              names = set(zf.namelist())
          assert 'manifest.gitci-output.json' in names
          assert 'appstore.iphone.6_9.portrait/01-hero.png' in names
          print(archive)
          PY
      - run: |
          tmpdir="$(mktemp -d)"
          .build/debug/gitci-screens init "$tmpdir" --name "CI Init Smoke"
          python3 - <<PY
          import base64
          from pathlib import Path
          Path("$tmpdir/hero-source.png").write_bytes(base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAFgwJ/lP7YzgAAAABJRU5ErkJggg=="
          ))
          PY
          .build/debug/gitci-screens scene-sets create "$tmpdir" --template gitci.core.basic-launch --id launch-template --asset "hero=$tmpdir/hero-source.png"
          .build/debug/gitci-screens scene-sets fill-assets "$tmpdir" --scene-set launch-template --asset "detail=$tmpdir/hero-source.png"
          .build/debug/gitci-screens validate "$tmpdir"
          .build/debug/gitci-screens validate "$tmpdir" --scene-set launch-template
          .build/debug/gitci-screens build "$tmpdir"
          .build/debug/gitci-screens build "$tmpdir" --scene-set launch-template
          test -f "$tmpdir/gitci/screens/build/launch/appstore.iphone.6_9.portrait/01-hero.png"
          test -f "$tmpdir/gitci/screens/build/launch-template/appstore.iphone.6_9.portrait/01-hero.png"
          grep -q "hero.png" "$tmpdir/gitci/screens/scene-sets/launch-template/scene-set.gitci.json"
          grep -q "detail.png" "$tmpdir/gitci/screens/scene-sets/launch-template/scene-set.gitci.json"
      - run: test -f examples/minimal/gitci/screens/build/launch/appstore.iphone.6_9.portrait/01-hero.png
      - run: test -f examples/minimal/gitci/screens/build/launch/appstore.iphone.6_9.portrait/02-workflow.png
      - run: test -f examples/minimal/gitci/screens/build/launch/appstore.iphone.6_9.portrait/03-span-1.png
      - run: test -f examples/minimal/gitci/screens/build/launch/appstore.iphone.6_9.portrait/04-span-2.png
      - run: test -f examples/minimal/gitci/screens/build/launch/appstore.ipad.13.portrait/01-hero.png
      - run: test -f examples/minimal/gitci/screens/build/launch/appstore.ipad.13.portrait/02-workflow.png
      - run: test -f examples/minimal/gitci/screens/build/launch/appstore.ipad.13.portrait/03-span-1.png
      - run: test -f examples/minimal/gitci/screens/build/launch/appstore.ipad.13.portrait/04-span-2.png
      - run: test -f examples/minimal/gitci/screens/build/launch/appstore.mac.16_10/01-hero.png
      - run: test -f examples/minimal/gitci/screens/build/launch/appstore.mac.16_10/02-workflow.png
      - run: test -f examples/minimal/gitci/screens/build/launch/appstore.mac.16_10/03-span.png
      - run: python3 scripts/check-png-size.py examples/minimal/gitci/screens/build/launch/appstore.iphone.6_9.portrait/01-hero.png 1320 2868
      - run: python3 scripts/check-png-size.py examples/minimal/gitci/screens/build/launch/appstore.ipad.13.portrait/01-hero.png 2064 2752
      - run: python3 scripts/check-png-size.py examples/minimal/gitci/screens/build/launch/appstore.mac.16_10/01-hero.png 2880 1800
      - run: test -f examples/minimal/gitci/screens/build/launch/manifest.gitci-output.json
      - run: test -f examples/minimal/gitci/screens/build/launch/gallery/index.html
      - run: test -f examples/minimal/gitci/screens/build/launch/gallery/data/packs.json
      - run: test -f examples/minimal/gitci/screens/build/launch/gallery/data/components.json
      - run: test -f examples/minimal/gitci/screens/build/launch/gallery/data/themes.json
      - run: test -f examples/minimal/gitci/screens/build/launch/gallery/data/palettes.json
      - run: test -f examples/minimal/gitci/screens/build/launch/gallery/data/scene-set-templates.json
      - uses: actions/upload-artifact@v4
        with:
          name: example-minimal-launch
          path: examples/minimal/gitci/screens/build/launch.zip
          retention-days: 14
