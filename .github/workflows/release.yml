name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - run: cd js && pnpm install --frozen-lockfile && pnpm build
      - run: swift build -c release
      - run: |
          mkdir -p dist
          cp .build/release/gitci-screens dist/gitci-screens-linux-x86_64
          tar -czf dist/gitci-screens-linux-x86_64.tar.gz -C dist gitci-screens-linux-x86_64
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
