[tools]
swift = "6.2"
node = "22"
pnpm = "latest"

[tasks.build]
run = [
  "swift build",
  "cd js && pnpm install && pnpm build"
]

[tasks.test]
run = [
  "swift test",
  "cd js && pnpm test"
]

[tasks.render-demo]
run = [
  "swift build",
  ".build/debug/gitci-screens export examples/minimal --strict"
]

[tasks.package-local]
run = [
  "swift build -c release",
  "cd js && pnpm install --frozen-lockfile && pnpm build",
  "scripts/package-release.sh gitci-screens-local .build/release/gitci-screens"
]

[tasks.docker-build]
run = "docker build -f docker/Dockerfile -t ghcr.io/gitci-labs/screens:local ."

[tasks.docker-run-demo]
run = "docker run --rm -v \"$PWD\":/workspace ghcr.io/gitci-labs/screens:local export /workspace/examples/minimal --strict"
