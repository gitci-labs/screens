name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - run: cd js && pnpm install --frozen-lockfile && pnpm build
      - run: swift build -c release
      - run: |
          package="gitci-screens-linux-x86_64"
          mkdir -p "dist/$package/bin"
          mkdir -p "dist/$package/share/gitci-screens"
          cp .build/release/gitci-screens "dist/$package/bin/gitci-screens"
          rsync -a js/ "dist/$package/share/gitci-screens/js/"
          rsync -a templates/ "dist/$package/share/gitci-screens/templates/"
          rsync -a schemas/ "dist/$package/share/gitci-screens/schemas/"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
